[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "carom-llm-client"
version = "1.1.0"
description = "CaroM - Cliente asíncrono unificado para OpenAI y Anthropic (streaming, Pydantic, reintentos)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Carolina Molfino" }]
# Rangos acotados: aceptan parches y mejoras menores, pero no una versión
# mayor nueva que pueda romper la API (como pasó con anthropic 2.0).
dependencies = [
    "openai>=3.46,<4",
    "anthropic>=2.6,<3",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.15,<1", "mypy>=2,<3"]

[tool.setuptools]
packages = ["llm_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["llm_client"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
